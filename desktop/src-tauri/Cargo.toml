[workspace]
# #6317: lets `cargo test -p tao` run the vendored crate's own regression tests
# (vendor/tao-0.35.3/src/platform_impl/macos/view.rs::window_teardown_tests) directly —
# a patched dependency's tests don't otherwise run as part of this crate's `cargo test`.
members = [".", "vendor/tao-0.35.3"]

[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
# #[tokio::test] in the real-path drills (#6138): macros for the attribute, rt to drive it.
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "sync"] }
futures-util = "0.3"
portable-pty = "0.9"
notify = "6"
md5 = "0.7"
libc = "0.2"

[patch.crates-io]
# #6317: tao 0.35.3's macOS NSView key/IME handlers `.unwrap()` a weak `ns_window` ref that is
# already gone once AppKit starts tearing the window down while the view still gets late events
# (e.g. an IME/key event settling after a composer send) — panicking inside an `extern "C"`
# callback with no unwind ABI, so the process aborts (SIGABRT, panic_cannot_unwind). No upstream
# fix is released (tauri-apps/tao#1171 is open), so vendor/tao-0.35.3 carries a patched copy:
# same version, so it still satisfies tauri-runtime-wry's `tao = "0.35.0"` requirement.
tao = { path = "vendor/tao-0.35.3" }
