<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-bus</title>
<style>
:root{--bg:#0a0e16;--panel:#111726;--card:#161d2e;--line:#1f2839;--tx:#e6edf6;--mut:#8a97a8;--dim:#5b6675;
--grn:#2dd4bf;--grn2:#14b8a6;--amb:#f59e0b;--blu:#4a90d9;--pur:#9b6fd4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header .logo{font-weight:800;letter-spacing:.5px;font-size:17px}
header .logo b{color:var(--grn)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);display:inline-block}
.muted{color:var(--mut)}.dim{color:var(--dim)}
header .spacer{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}
aside h2,.feed h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:0 0 10px;font-weight:700}
.sess{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:default}
.sess:hover{border-color:#2c3a52}
.sess .top{display:flex;align-items:center;gap:7px}
.sess .name{font-weight:600;font-size:13.5px;word-break:break-all}
.sess .off{background:var(--dim);box-shadow:none}
.sess .status{color:var(--mut);font-size:12.5px;margin-top:3px}
.sess .meta{color:var(--dim);font-size:11px;margin-top:3px}
.right{display:flex;flex-direction:column;min-height:0}
.feed{flex:1;overflow-y:auto;padding:14px 18px}
.msg{padding:6px 0;border-bottom:1px solid #131a28;font-size:13.5px}
.msg .t{color:var(--dim);font-size:11px;font-family:ui-monospace,monospace}
.msg .from{color:var(--grn);font-weight:600}.msg .to{color:var(--blu)}
.msg.broadcast .to{color:var(--amb)}
.compose{border-top:1px solid var(--line);background:var(--panel);padding:12px 18px;display:flex;gap:8px;align-items:center}
.compose select,.compose input{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 11px;font-size:13px}
.compose input{flex:1}
.compose button{background:var(--grn2);border:none;color:#04201d;font-weight:700;border-radius:8px;padding:8px 16px;cursor:pointer}
.compose button:hover{background:var(--grn)}
.empty{color:var(--dim);padding:20px;text-align:center}
</style></head>
<body>
<header>
  <span class="dot" id="livedot"></span>
  <span class="logo">agent<b>·</b>bus</span>
  <span class="pill" id="hub">—</span>
  <span class="spacer"></span>
  <span class="pill"><span id="nsess">0</span> live · <span id="nmsg">0</span> msgs</span>
</header>
<main>
  <aside>
    <h2>Connected agents</h2>
    <div id="sessions"><div class="empty">no sessions yet</div></div>
  </aside>
  <div class="right">
    <div class="feed"><h2>Live feed</h2><div id="feed"></div></div>
    <div class="compose">
      <span class="dim">send&nbsp;→</span>
      <select id="to"><option value="all">all (broadcast)</option></select>
      <input id="text" placeholder="message the bus as 'dashboard'…" />
      <button id="send">Send</button>
    </div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const ago=ms=>{const s=Math.floor((Date.now()-ms)/1000);return s<60?s+'s':s<3600?Math.floor(s/60)+'m':Math.floor(s/3600)+'h';};
let nmsg=0;
async function loadPeers(){
  try{const {peers}=await (await fetch('/peers')).json();
    peers.sort((a,b)=>b.lastSeen-a.lastSeen);
    const live=peers.filter(p=>p.online);
    $('#nsess').textContent=live.length;
    $('#sessions').innerHTML=peers.length?peers.map(p=>`<div class="sess"><div class="top"><span class="dot ${p.online?'':'off'}"></span><span class="name">${esc(p.session)}</span></div>${p.status?`<div class="status">${esc(p.status)}</div>`:''}<div class="meta">${p.online?'online':'offline'} · ${ago(p.lastSeen)} ago</div></div>`).join(''):'<div class="empty">no sessions yet</div>';
    const sel=$('#to');const cur=sel.value;
    sel.innerHTML='<option value="all">all (broadcast)</option>'+peers.map(p=>`<option value="${esc(p.session)}">${esc(p.session)}</option>`).join('');
    sel.value=cur;
  }catch(e){}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function addMsg(m,count=true){
  if(count){nmsg++;$('#nmsg').textContent=nmsg;}
  const d=document.createElement('div');d.className='msg'+(m.to==='all'?' broadcast':'');
  d.innerHTML=`<span class="t">${new Date(m.ts).toLocaleTimeString()}</span> <span class="from">${esc(m.from)}</span> <span class="dim">→</span> <span class="to">${esc(m.to)}</span>: ${esc(m.text)}`;
  const f=$('#feed');f.appendChild(d);f.scrollTop=f.scrollHeight;
}
function stream(){
  const ev=new EventSource('/stream?session=all');
  ev.onmessage=e=>{try{addMsg(JSON.parse(e.data));loadPeers();}catch(_){}};
  ev.onerror=()=>{$('#livedot').style.background='#f59e0b';setTimeout(()=>{ev.close();stream();$('#livedot').style.background='';},2000);};
}
$('#send').onclick=async()=>{const t=$('#text').value.trim();if(!t)return;
  await fetch('/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:'dashboard',to:$('#to').value,text:t})});
  $('#text').value='';};
$('#text').addEventListener('keydown',e=>{if(e.key==='Enter')$('#send').click();});
fetch('/recent?limit=60').then(r=>r.json()).then(d=>{(d.messages||[]).forEach(m=>addMsg(m,false));}).catch(()=>{});
fetch('/health').then(r=>r.json()).then(h=>{$('#nmsg').textContent=nmsg=h.messages||0;});
$('#hub').textContent=location.host;
loadPeers();setInterval(loadPeers,3000);stream();
</script>
</body></html>
