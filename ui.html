<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>trantor</title>
<style>
:root{--bg:#0a0e16;--panel:#111726;--card:#161d2e;--card2:#1b2335;--line:#1f2839;--tx:#e6edf6;--mut:#8a97a8;--dim:#5b6675;
--grn:#2dd4bf;--grn2:#14b8a6;--amb:#f59e0b;--blu:#4a90d9;--red:#ef6a6a;--pur:#9b6fd4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:13px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:800;letter-spacing:.4px;font-size:16px}.logo b{color:var(--grn)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);display:inline-block;flex:0 0 auto}
.dot.off{background:var(--dim);box-shadow:none}
.muted{color:var(--mut)}.dim{color:var(--dim)}.spacer{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:var(--lw,44px) 1fr 330px;min-height:0}
main.learn-open{--lw:372px}
.boards{overflow-y:auto;padding:16px 18px}
/* Learning sidebar (collapsible left rail) — surfaces the self-learning loop */
.learn{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.learn-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.learn-head .lt{font-weight:700;font-size:13px;color:var(--tx)}.learn-head .lt b{color:var(--grn)}
.learn-head .chev{margin-left:auto;color:var(--mut);font-size:14px}
main:not(.learn-open) .learn-head{flex-direction:column;gap:12px;padding:14px 0;height:100%;border-bottom:none;justify-content:flex-start}
main:not(.learn-open) .learn-head .lt{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.6px}
main:not(.learn-open) .learn-head .chev{margin:0}
main:not(.learn-open) .learn-body{display:none}
.learn-body{overflow-y:auto;padding:10px 12px 26px;flex:1}
.lsum{font-size:11.5px;color:var(--mut);line-height:1.5;margin-bottom:13px}.lsum b{color:var(--grn)}
.lsec{margin-bottom:17px}
.lsec>h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:0 0 7px;display:flex;align-items:center;gap:6px}
.lsel{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:11px;padding:2px 4px;margin-left:auto;cursor:pointer;outline:none}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px}
.lcard .lc-h{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px}
.lcard .lc-h .nm{font-weight:600;color:var(--tx)}
.lcard .lc-h .mut{color:var(--mut);font-size:10.5px;margin-left:auto}
.lles{font-size:11.5px;color:var(--mut);line-height:1.45;padding:5px 0;border-top:1px solid var(--line)}
.lles:first-child{border-top:none}
.lles .sc{display:inline-block;font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-right:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.4px}
.lguard{font-size:11px;color:var(--mut);line-height:1.42;padding:3px 0 3px 13px;position:relative}
.lguard:before{content:"";position:absolute;left:3px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--grn)}
.ltask{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:5px 0 2px}
.lstat{display:inline-block;font-size:10.5px;color:var(--mut);margin-right:10px}
.lstat b{color:var(--tx)}.lstat.bad b{color:var(--red)}.lstat.good b{color:var(--grn)}
.lchart{margin-top:4px}.lchart svg{display:block;width:100%;height:42px}
.lbadge{font-size:8.5px;color:var(--grn);border:1px solid #1d4a44;border-radius:8px;padding:1px 6px;text-transform:none;letter-spacing:0}
.lempty{font-size:11px;color:var(--dim);font-style:italic;padding:4px 0}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.proj-h{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);background:#0e1421;border-left:3px solid var(--grn)}
.proj-h .pname{font-family:'Sora',ui-sans-serif,sans-serif;font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1.05;flex:none;white-space:nowrap;padding-right:6px;border-right:1px solid var(--line);margin-right:3px}
.proj-h .pname b{color:var(--grn)}
.proj.idle .proj-h{border-left-color:var(--line)}
.proj.idle .proj-h .pname{font-size:16px}
.agents{display:flex;gap:6px;flex-wrap:wrap}
.agent{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 9px 2px 6px;font-size:11.5px;color:var(--mut)}
.agent .nm{color:var(--tx)}
.agent svg{flex:none}
.agent.offl{opacity:.42}
.agent.err{border-color:#ef4444;color:#ef4444}
.agent.err .nm{color:#ef4444}
.agent.down{border-color:#ef4444;background:rgba(239,68,68,.14);color:#ef4444}
.agent.down .nm{color:#ef4444;font-weight:600}
.agent .ast{color:var(--mut)}
.prog{font-size:11.5px;color:var(--dim);white-space:nowrap}
/* project brief + phase row */
.proj-brief{display:flex;align-items:center;gap:12px;padding:9px 16px 4px;flex-wrap:wrap}
.brief{font-size:12.5px;color:var(--mut);line-height:1.45;flex:1;min-width:200px}
.brief.dim{color:var(--dim);font-style:italic}
.phase{font-size:11px;font-weight:600;padding:3px 10px;border-radius:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card)}
.phase.building{color:var(--blu);border-color:#26405f}
.phase.blocked{color:var(--red);border-color:#5a2c2c}
.phase.shipped{color:var(--grn);border-color:#1d4a44}
.phase.planned{color:var(--mut)}
.pbar{height:4px;border-radius:3px;background:#0d1320;margin:2px 16px 0;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn2),var(--grn));border-radius:3px;transition:width .4s}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 16px}
.col{background:#0d1320;border:1px solid var(--line);border-radius:10px;padding:9px;min-height:140px;max-height:clamp(280px,58vh,1100px);overflow-y:auto}
.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{background:#243049;border-radius:3px}
.col h4{position:sticky;top:-9px;background:#0d1320;padding:9px 0 6px;margin-top:-9px;z-index:1}
.col h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);display:flex;justify-content:space-between}
.col.todo h4 i{color:var(--mut)}.col.doing h4 i{color:var(--blu)}.col.testing h4 i{color:var(--amb)}.col.done h4 i{color:var(--grn)}.col.blocked h4 i{color:var(--red)}
.col h4 i{font-style:normal}
.tcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:7px;padding:7px 9px;margin-bottom:7px;cursor:pointer;font-size:13px}
.tcard:hover{background:var(--card2);border-color:#2c3a52}
.col.doing .tcard{border-left-color:var(--blu)}.col.testing .tcard{border-left-color:var(--amb)}.col.done .tcard{border-left-color:var(--grn)}.col.blocked .tcard{border-left-color:var(--red)}
.tcard.failed{border-left-color:var(--red);border-color:#5a2c2c;animation:failpulse 1.1s ease-in-out infinite}
.tcard.failed .who{color:#ef6a6a}
@keyframes failpulse{0%,100%{box-shadow:0 0 0 0 rgba(239,106,106,0)}50%{box-shadow:0 0 14px 2px rgba(239,106,106,.55);border-color:#ef6a6a}}
.tcard .who{color:var(--dim);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
.diff{font-size:9px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:8px;margin-left:5px;vertical-align:1px}
.diff.easy{background:#13302b;color:#2dd4bf}.diff.medium{background:#2c2a17;color:#f5d90b}.diff.hard{background:#33181f;color:#ff7a90}
.bounce{display:inline-block;font-size:9.5px;font-weight:700;color:#ef6a6a;background:#2a1517;border:1px solid #5a2c2c;border-radius:8px;padding:1px 6px;margin-left:5px}
.mdl{font-size:9px;font-family:ui-monospace,monospace;color:#8fa3be;background:#16202f;border:1px solid #243049;border-radius:7px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.tcard.done{opacity:.65}.tcard.done span{text-decoration:line-through}
.empty{color:var(--dim);text-align:center;padding:30px}
.empty.big{padding:60px 20px;font-size:15px}
/* idle projects — collapsed thin rows below the live boards */
.idle-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:700;margin:18px 2px 8px}
.idle-row{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 14px;margin-bottom:7px;font-size:12.5px;color:var(--mut);cursor:pointer}
.idle-row:hover{background:var(--card);border-color:#2c3a52}
.idle-row .nm{color:var(--tx);font-weight:600}
.mv{display:inline-flex;gap:3px;margin-left:6px}
.mv b{cursor:pointer;color:var(--dim);font-size:10px;line-height:1;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-weight:400}
.mv b:hover{color:var(--tx);border-color:#2c3a52}
.pdel{cursor:pointer;color:var(--dim);font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-left:5px;white-space:nowrap}
.pdel:hover{color:var(--red);border-color:#5a2c2c}
.pdel.arm{color:#fff;background:var(--red);border-color:var(--red)}
.sortmode{font-size:10.5px;color:var(--dim);margin:0 0 10px;cursor:pointer;user-select:none}
.sortmode:hover{color:var(--mut)}
.proj.idle .proj-h{opacity:.55;cursor:pointer}
/* flow (DAG) view */
/* view switcher — a clearly-labelled segmented control so it doesn't disappear next to the model chips */
.vtog{display:inline-flex;align-items:stretch;margin-left:12px;border:1px solid #34465f;border-radius:11px;overflow:hidden;background:#0c121e;flex:none}
.vtog .vlbl{display:flex;align-items:center;font-size:8.5px;font-weight:800;letter-spacing:.09em;color:var(--mut);padding:0 8px;text-transform:uppercase;background:#131c2c;border-right:1px solid #34465f}
.vbtn{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:4px 13px;border:0;border-left:1px solid #1f2839;background:transparent;color:#9fb0c4;cursor:pointer}
.vbtn:first-of-type{border-left:0}
.vbtn:hover{background:#172339;color:var(--tx)}
.vbtn.on{color:#04110e;background:var(--grn)}
.vbtn.on:hover{background:var(--grn);color:#04110e}
.flowwrap{padding:14px 16px;overflow:auto}
.flowwrap svg{display:block}
.fnode{cursor:pointer}
.fnode rect{fill:var(--card);stroke:var(--line);stroke-width:1.4;rx:9}
.fnode.todo rect{stroke:#3a4458}
.fnode.doing rect{stroke:var(--blu);filter:drop-shadow(0 0 5px rgba(74,144,217,.45))}
.fnode.testing rect{stroke:var(--amb);filter:drop-shadow(0 0 5px rgba(245,158,11,.4))}
.fnode.done rect{stroke:var(--grn);fill:#0f1d1b}
.fnode.blocked rect{stroke:var(--red)}
.fnode.failed rect{stroke:var(--red);animation:fpulse 1.1s ease-in-out infinite}
@keyframes fpulse{0%,100%{filter:drop-shadow(0 0 0 rgba(239,106,106,0))}50%{filter:drop-shadow(0 0 9px rgba(239,106,106,.8))}}
.fnode text{fill:var(--tx);font-size:11.5px;font-family:ui-sans-serif,system-ui}
.fnode .fmeta{fill:var(--dim);font-size:9.5px}
.fnode.done .ftitle{fill:#7d9b95;text-decoration:line-through}
.fedge{fill:none;stroke:#2b3650;stroke-width:1.6}
.fedge.done{stroke:var(--grn2);opacity:.8}
.fedge.active{stroke:var(--blu);stroke-dasharray:6 5;animation:fdash 1s linear infinite}
@keyframes fdash{to{stroke-dashoffset:-11}}
.floop{fill:none;stroke:var(--red);stroke-width:1.4;opacity:.85}
.floopn{fill:var(--red);font-size:9px;font-weight:700}
.flowwrap{position:relative;height:66vh;min-height:340px;overflow:hidden;background:radial-gradient(circle at 1px 1px, #18233a 1px, transparent 0);background-size:26px 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:grab}
.flowwrap.panning{cursor:grabbing}
.flowwrap svg{position:absolute;inset:0;width:100%;height:100%}
.fnode{cursor:move}
.fctl{position:absolute;top:8px;right:10px;display:flex;gap:4px;z-index:2}
.fctl button{font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}
.fctl button:hover{color:var(--grn);border-color:#1d4a44}
.fhint{position:absolute;bottom:7px;right:10px;font-size:9.5px;color:var(--dim);z-index:2;pointer-events:none}
.fedge-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.felabel{fill:#7e8ca3;font-size:9px;font-family:ui-monospace,monospace;opacity:0;pointer-events:none;transition:opacity .15s}
.fe:hover .felabel{opacity:1}
.fe:hover .fedge{stroke:#5fa8ff}
/* FLOW = development timeline: build-order columns, agent lanes, readable fixed cards, native scroll */
.tlwrap{position:relative;background:#0b1019;border-top:1px solid var(--line);overflow:hidden}
.tlscroll{position:absolute;inset:0;overflow-x:auto;overflow-y:auto}
.tlscroll svg{display:block}
.tlband{fill:#101827}
.tlsep{stroke:#161e2c;stroke-width:1}
.tlgrid{stroke:#161e2c;stroke-width:1}
.tlt{fill:var(--dim);font-size:9px;font-family:ui-sans-serif,system-ui;text-anchor:middle}
.tledge{fill:none;stroke:#33405c;stroke-width:1.6;opacity:.8}
.tledge.done{stroke:var(--grn2)}
.tlbar{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
.tlnode{cursor:default}
.tlnode:hover .tlbar{stroke:rgba(255,255,255,.55)}
.tlnode.doing .tlbar,.tlnode.testing .tlbar{stroke:rgba(255,255,255,.3)}
.tlnode.failed .tlbar,.tlnode.blocked .tlbar{stroke:var(--red)}
.tltitle{fill:#eaf1fa;font-size:10.5px;font-family:ui-sans-serif,system-ui;pointer-events:none}
/* pinned lane-label gutter (stays put while the chart scrolls) */
.tlgut{position:absolute;left:0;top:0;bottom:0;background:#0b1019;border-right:1px solid var(--line);z-index:3;pointer-events:none}
.tlguth{display:flex;align-items:center;padding-left:8px;font-size:9px;color:var(--dim);border-bottom:1px solid #161e2c}
.tlgl{display:flex;align-items:center;gap:6px;padding-left:8px;font-size:11px;font-weight:600;color:var(--mut)}
.tlgl svg{flex:none}
.tlwrap .fhint{position:absolute;right:10px;bottom:6px;z-index:3}
.tlnode{cursor:pointer}
/* FLOW v2 = horizontal orchestrator-rooted flowchart TREE. A spine runs left→right; each phase is a
   ◇ plan node that fans OUT (drawn edges) to its crew/LLM card nodes, then converges INTO a ◆ integrate
   node, which connects to the next phase. Agent is a node property, not the axis. Native horizontal scroll. */
.pflowwrap{background:#0b1019;border-top:1px solid var(--line)}
.finfo{background:#1a2030;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--mut);margin:10px 14px 0}
.pflowwrap.gflow{position:relative;padding-bottom:22px}
.gscroll{overflow-x:auto;overflow-y:hidden;padding:4px 0 2px}
.gscroll svg{display:block}
.gedge{fill:none;stroke:#33405c;stroke-width:1.6;opacity:.8}
.gedge.done{stroke:var(--grn2);opacity:.5}
.gspine{fill:none;stroke:#5a6b86;stroke-width:2.5}
.gnode{cursor:default}
.gnode[data-id]{cursor:pointer}
.gnbox{fill:#101827;stroke:rgba(255,255,255,.12);stroke-width:1}
.gnode[data-id]:hover .gnbox{stroke:rgba(255,255,255,.55);fill:#162032}
.gnode.orch .gnbox{fill:#0e1730;stroke:#2c3a55;stroke-dasharray:4 3}
.gnode.failed .gnbox,.gnode.blocked .gnbox{stroke:var(--red)}
.gntext{fill:#eaf1fa;font-size:11px;font-family:ui-sans-serif,system-ui;pointer-events:none}
.gnsub{fill:var(--mut);font-size:9.5px;font-family:ui-sans-serif,system-ui;pointer-events:none}
.pfband{fill:#0c1320;opacity:.45}
.pfband.alt{fill:#0e1626;opacity:.55}
.pfbandtop{opacity:.12}
.pfbandtop.done{fill:var(--grn2)}.pfbandtop.active{fill:#f0b24b}.pfbandtop.failed,.pfbandtop.blocked{fill:var(--red)}.pfbandtop.planned{fill:#46566f}
.pflabel{font-size:16px;font-weight:800;font-family:ui-sans-serif,system-ui}
.pflabel.done{fill:var(--grn2)}.pflabel.active{fill:#f0b24b}.pflabel.failed{fill:var(--red)}.pflabel.planned,.pflabel.blocked{fill:#aeb9c8}
.pfcount{fill:var(--mut);font-size:10.5px;font-family:ui-sans-serif,system-ui}
.pfsub{fill:#9fb0c4;font-size:10.5px;font-family:ui-sans-serif,system-ui}
.pflowwrap .fhint{position:absolute;right:12px;bottom:5px}
/* card detail modal — the full story of one card: status journey + the agent's own bus reports */
.cmodal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,7,12,.62)}
.cmpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,93vw);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 64px rgba(0,0,0,.55)}
.cmhead{display:flex;align-items:flex-start;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.cmtitle{font-size:15px;font-weight:700;color:var(--tx);line-height:1.35}
.cmmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mut)}
.cmmeta svg{flex:none;vertical-align:middle}
.cmstat{font-size:10px;padding:1px 8px;border-radius:9px;border:1px solid var(--line)}
.cmclose{margin-left:auto;cursor:pointer;color:var(--mut);font-size:17px;line-height:1;padding:3px 7px;border-radius:6px;flex:none}
.cmclose:hover{background:var(--card);color:var(--tx)}
.cmbody{overflow-y:auto;padding:10px 18px 18px}
.cmrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid #161e2c;font-size:12.5px;line-height:1.5}
.cmrow:first-child{border-top:none}
.cmrow .cmt{flex:none;color:var(--dim);font-size:10px;width:66px;padding-top:2px}
.cmrow.ev .cmtx{color:var(--mut)}
.cmrow .cmtx b{color:var(--tx);font-weight:600}
.cmrow.msg .cmfrom{color:var(--tx);font-weight:600}
.cmrow.msg svg{vertical-align:-2px}
.cmempty{color:var(--dim);font-style:italic;font-size:12px;padding:8px 0}
/* timeline view */
.timeline{padding:14px 18px;overflow-y:auto;max-height:66vh;display:flex;flex-direction:column;gap:5px;background:#0c111c;border-top:1px solid var(--line)}
.tevent{font-size:12.5px;line-height:1.4;color:var(--mut);display:flex;align-items:center;gap:7px;padding:4px 0}
.tevent .tts{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);min-width:64px}
.tevent .tphrase b{color:var(--tx)}
.tevent .tstatus{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tevent .tstatus.todo{color:var(--mut)}
.tevent .tstatus.doing{color:var(--blu)}
.tevent .tstatus.testing{color:var(--amb)}
.tevent .tstatus.failed{color:var(--red)}
.tevent .tstatus.done{color:var(--grn)}
.tevent .tstatus.blocked{color:var(--red)}
.tevent .arr{color:var(--dim);margin:0 2px}
/* per-project inter-agent conversation lane */
.proj-chat{margin:4px 16px 14px;border:1px solid var(--line);border-radius:10px;background:#0c111c}
.proj-chat h5{margin:0;padding:7px 11px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.proj-chat h5 .lc{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 6px var(--grn)}
.chatlog{max-height:clamp(130px,20vh,320px);overflow-y:auto;padding:7px 11px;display:flex;flex-direction:column;gap:5px}
.cmsg{font-size:12px;line-height:1.4;color:var(--tx)}
.cmsg .ct{color:var(--dim);font-family:ui-monospace,monospace;font-size:10px;margin-right:5px}

const BRAND=[[/claude|anthropic/,'anthropic'],[/codex|openai|gpt|chatgpt/,'openai'],[/gemini|bard/,'gemini'],[/mistral|mixtral/,'mistral'],[/deepseek/,'deepseek'],[/kimi|moonshot|\bk2\b/,'moonshot'],[/qwen/,'qwen'],[/grok|xai/,'grok'],[/cursor/,'cursor']];
function brandOf(s){const x=String(s).toLowerCase();for(const[re,b]of BRAND)if(re.test(x))return b;return null;}
function iconFor(s,size){const b=brandOf(s);if(!b||!ICON[b])return `<span style="display:inline-flex;width:${size}px;height:${size}px;align-items:center;justify-content:center;border-radius:50%;background:#2a3346;color:#aeb9c9;font-size:${Math.round(size*.55)}px;font-weight:700">${esc(String(s).slice(0,1).toUpperCase())}</span>`;const i=ICON[b];return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor" style="color:${i.c}">${i.p.map(d=>`<path d="${d}"/>`).join('')}</svg>`;}
const phaseClass=ph=>/^idle ·/.test(ph)?'planned':/FAILED|blocked/.test(ph)?'blocked':/building|verifying|progress/.test(ph)?'building':/shipped|done/.test(ph)?'shipped':'planned';

let POOLS={};
let ECON=null;
const ECON_WINS=[['24h','last 24h'],['week','last week'],['month','last month'],['quarter','last quarter'],['year','last year']];
let econWin=localStorage.getItem('abEconWin')||'24h';
const econSaved=x=>x?(x.saved_usd!=null?(+x.saved_usd):Math.max(0,(x.opus_equiv_usd||0)-(x.cost_usd||0))):0;
function renderEcon(){
  if(!ECON||!ECON.lifetime||!ECON.lifetime.calls)return;
  const el=$('#econ'); el.style.display='';
  // lifetime running total is the fixed headline; the dropdown picks the comparison window.
  if(!el.dataset.built){
    el.innerHTML=`🪙 Trantor saved <b style="color:var(--grn)" id="econlife"></b> vs frontier`+
      `<span style="opacity:.55"> · lifetime · </span>`+
      `<select id="econsel" title="comparison window" style="background:#1a2030;color:inherit;border:1px solid rgba(255,255,255,.18);border-radius:4px;font:inherit;font-size:11px;padding:1px 3px;cursor:pointer;outline:none">`+
        ECON_WINS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')+`</select>`+
      `<span style="opacity:.85" id="econwinval"></span>`;
    const sel=$('#econsel'); sel.value=econWin;
    sel.onchange=()=>{econWin=sel.value; localStorage.setItem('abEconWin',econWin); renderEcon();};
    el.dataset.built='1';
  }
  const w=(ECON.windows&&ECON.windows[econWin])||ECON.scrooge, wc=w?w.calls:0;
  $('#econlife').textContent='$'+econSaved(ECON.lifetime).toFixed(2);
  $('#econwinval').textContent=' $'+econSaved(w).toFixed(2)+' ('+wc+' call'+(wc===1?'':'s')+')';
  const sel=$('#econsel'); if(sel)sel.value=econWin;
}
async function econ(){
  try{
    const e=await (await fetch('/economics')).json();
    POOLS={}; for(const[k,v]of Object.entries(e.profile||{}))POOLS[k]=v.tier;
    ECON=e; renderEcon();
  }catch(_){}
}
econ();setInterval(econ,15000);
function poolOf(session){const b=brandOf(session);const k=b==='anthropic'?'claude':b==='openai'?'codex':b==='moonshot'?'kimi':b;return POOLS[k]||'';}
const VIEWS = JSON.parse(localStorage.getItem("abViews") || "{}");
let HISTORY = {};
let PHASES = {};
function setView(proj, v){ VIEWS[proj] = v; localStorage.setItem("abViews", JSON.stringify(VIEWS)); render(); }
function toggleIdle(name){ if(!name)return; const s=new Set(JSON.parse(localStorage.getItem("abIdleOpen")||"[]")); s.has(name)?s.delete(name):s.add(name); localStorage.setItem("abIdleOpen",JSON.stringify([...s])); render(); }
let armedDel=null,armedTs=0;   // pending ✕ confirmation (project name + when it was armed)
// ▲▼: snapshot the currently displayed order, swap, persist — manual order then wins until ↺ reset
function moveProj(name,dir){
  const names=[...document.querySelectorAll('#boards [data-projname]')].map(d=>d.dataset.projname);
  const i=names.indexOf(name),j=i+dir;
  if(i<0||j<0||j>=names.length)return;
  [names[i],names[j]]=[names[j],names[i]];
  localStorage.setItem("abOrder",JSON.stringify(names)); render();
}
// FLOW v2 = the project's TRUE shape: an orchestrator-rooted phase flowchart. The orchestrator is the
// spine (the left rail); each PHASE blooms — ◇ plan → the crew fans out to its cards → ◆ converge —
// then the next phase begins. Agent identity is a node badge, not the axis. Phases come from the hub
// (/phases: title-prefix + time-cluster; deps-sparse boards fall back to time + a visible notice).
// Each crew node keeps its full /card detail on click.
function flowHTML(pt, proj){
  const data = PHASES[proj];
  if (!data) return '<div class="pflowwrap"><div class="empty">loading flow…</div></div>';
  if (!data.phases || !data.phases.length) return '<div class="pflowwrap"><div class="empty">no cards yet</div></div>';
  const SCOL = { todo:'#3a4458', doing:'#4a90d9', testing:'#f59e0b', failed:'#ef6a6a', blocked:'#ef6a6a', done:'#14b8a6' };
  const NW = 168, NH = 34, RG = 11, CG = 64, PGAP = 76, MT = 64, MB = 22;
  const stackH = n => n*NH + Math.max(0,n-1)*RG;
  // Per-phase layout: cards spread by their INTRA-PHASE dependency depth. Independent cards share
  // column 0 (parallel, hanging off the plan node); a card that depends on another lands one column
  // to the right of its parent (a branch/chain). Leaves (no dependents) converge into integrate.
  const layouts = data.phases.map(ph => {
    const work = [...ph.crew.map(n => ({ ...n, _orch:false })), ...ph.orchestrators.map(n => ({ ...n, _orch:true }))];
    const cards = work.length ? work : [{ id:0, title:'(no cards)', status:ph.status, agent:'', synthetic:true, deps:[] }];
    const idSet = new Set(cards.map(c => c.id)); const byId = {}; cards.forEach(c => byId[c.id] = c);
    const parentsOf = c => (c.deps || []).filter(d => idSet.has(d) && d !== c.id);
    const dmemo = {}; const depth = (c, seen) => {
      if (dmemo[c.id] != null) return dmemo[c.id];
      seen = seen || new Set(); if (seen.has(c.id)) return 0; seen.add(c.id);
      const ps = parentsOf(c); const d = ps.length ? Math.max(...ps.map(p => depth(byId[p], seen))) + 1 : 0;
      return (dmemo[c.id] = d);
    };
    cards.forEach(c => c._d = depth(c));
    const maxDepth = Math.max(0, ...cards.map(c => c._d));
    const cols = []; for (let d = 0; d <= maxDepth; d++) cols[d] = cards.filter(c => c._d === d);
    const hasChild = c => cards.some(o => parentsOf(o).includes(c.id));
    return { ph, cards, byId, parentsOf, hasChild, maxDepth, cols };
  });
  const maxColCount = Math.max(1, ...layouts.flatMap(L => L.cols.map(c => c.length)));
  const Y0 = MT + stackH(maxColCount)/2;               // shared horizontal spine midline
  const totalH = MT + stackH(maxColCount) + MB;
  const gnode = (x, y, title, status, id, orch, agent) => {
    const stripe = SCOL[status] || '#3a4458';
    return `<g class="gnode ${status}${orch?' orch':''}"${id?` data-id="${id}"`:''}>`

function wireFlow(el){
  el.querySelectorAll(".flowwrap").forEach(w => {
    const proj = w.dataset.proj, svg = w.querySelector("svg"), g = w.querySelector(".fcam");
    let cam = (JSON.parse(localStorage.getItem("abFlowCam") || "{}"))[proj] || { s: 0.9, tx: 30, ty: 20 };
    const apply = () => g.setAttribute("transform", `translate(${cam.tx},${cam.ty}) scale(${cam.s})`);
    const zoomAt = (px, py, k) => {
      const ns = Math.min(2.5, Math.max(0.2, cam.s * k));
      cam.tx = px - (px - cam.tx) * (ns / cam.s); cam.ty = py - (py - cam.ty) * (ns / cam.s); cam.s = ns;
      apply(); saveCam(proj, cam);
    };
    const fit = () => {
      try {
        const bb = g.getBBox(), r = w.getBoundingClientRect();
        const sc = Math.min((r.width - 40) / bb.width, (r.height - 40) / bb.height, 1.6);
        cam = { s: sc, tx: (r.width - bb.width * sc) / 2 - bb.x * sc, ty: (r.height - bb.height * sc) / 2 - bb.y * sc };
        apply(); saveCam(proj, cam);

    w.addEventListener("wheel", e => {
      if (!(e.metaKey || e.ctrlKey)) return;          // let it through — never trap page scroll

    }, { passive: false });
    w.addEventListener("pointerdown", e => {
      if (e.target.closest(".fctl")) return;          // controls are not a pan gesture
      const node = e.target.closest(".fnode");
      if (node) {           // drag a node
        const id = node.dataset.id;
        const tr = /translate\(([-\d.]+),([-\d.]+)\)/.exec(node.getAttribute("transform"));
        dragging = { kind: "node", node, id, sx: e.clientX, sy: e.clientY, ox: +tr[1], oy: +tr[2], moved: false, proj };
      } else {              // pan the canvas
        dragging = { kind: "pan", sx: e.clientX, sy: e.clientY, ox: cam.tx, oy: cam.ty, w, proj };

        localStorage.setItem("abFlowPos", JSON.stringify(pos));

  el.innerHTML=(ORDER.length?`<div class="sortmode" id="sortreset" title="you've ordered projects manually — click to go back to automatic (recency) ordering">sort: manual · ↺ back to auto</div>`:'')
    +live.map(projBlock).join('')
    +(idlers.length?`<div class="idle-head">idle projects · ${idlers.length}</div>`+idlers.map(p=>idleOpen.has(p.project)?projBlock(p):idleRow(p)).join(''):'');
  // keep each project's chat scrolled to the latest line
  el.querySelectorAll('.chatlog').forEach(c=>{if(c.scrollHeight-c.clientHeight<60||c.dataset.stuck!=='0')c.scrollTop=c.scrollHeight;c.onscroll=()=>{c.dataset.stuck=(c.scrollHeight-c.scrollTop-c.clientHeight<40)?'1':'0';};});
  // click a card -> advance status todo->doing->done
  el.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>setView(b.dataset.proj,b.dataset.view));
  // collapsed idle row -> expand; expanded idle project's header -> collapse again
  el.querySelectorAll('.idle-row').forEach(r=>r.onclick=e=>{if(e.target.closest('.mv,.pdel'))return;toggleIdle(r.dataset.idleproj);});
  el.querySelectorAll('.proj.idle .proj-h').forEach(h=>h.onclick=e=>{if(e.target.closest('.vbtn,.agent,.mv,.pdel'))return;toggleIdle(h.closest('.proj').dataset.idleproj);});
  // ▲▼ reorder (persists as a manual order); ✕ forget — armed two-step, no popup
  el.querySelectorAll('.mvup').forEach(b=>b.onclick=e=>{e.stopPropagation();moveProj(b.dataset.proj,-1);});
  el.querySelectorAll('.mvdn').forEach(b=>b.onclick=e=>{e.stopPropagation();moveProj(b.dataset.proj,1);});
  el.querySelectorAll('.pdel').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const p=b.dataset.proj;
    if(!(armedDel===p&&Date.now()-armedTs<4000)){armedDel=p;armedTs=Date.now();b.classList.add('arm');b.textContent='✕ sure?';return;}
    armedDel=null;
    await fetch('/project/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({project:p})});
    render();
  });
  // the 2.5s re-render rebuilds the DOM — re-apply a still-fresh armed state so the
  // "✕ sure?" confirmation survives until it expires instead of silently resetting
  if(armedDel&&Date.now()-armedTs<4000){const ab=el.querySelector(`.pdel[data-proj="${CSS.escape(armedDel)}"]`);if(ab){ab.classList.add('arm');ab.textContent='✕ sure?';}}
  const sr=$('#sortreset');if(sr)sr.onclick=()=>{localStorage.removeItem('abOrder');render();};
  wireFlow(el);wireTimeline(el);
  // keep each timeline scrolled to the latest event
  el.querySelectorAll('.timeline').forEach(c=>{if(c.scrollHeight-c.clientHeight<60||c.dataset.stuck!=='0')c.scrollTop=c.scrollHeight;c.onscroll=()=>{c.dataset.stuck=(c.scrollHeight-c.scrollTop-c.clientHeight<40)?'1':'0';};});
  el.querySelectorAll('.tcard, .fnode').forEach(c=>c.onclick=async()=>{
    const id=+c.dataset.id,t=tasks.find(x=>x.id===id);if(!t)return;
    if(suppressClickId&&+suppressClickId===id)return;   // drag-end, not a click
    const next={todo:'doing',doing:'testing',testing:'done',failed:'doing',done:'todo',blocked:'doing'}[t.status];
    await fetch('/task/update',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,status:next})});render();
  });
}
function addMsg(m,count=true){
  if(count){nmsg++;$('#ntask');}
  const d=document.createElement('div');d.className='msg'+(m.to==='all'?' bc':'');
  d.innerHTML=`<span class="t">${new Date(m.ts).toLocaleTimeString()}</span> ${iconFor(m.from,12)} <span class="from">${esc(m.from)}</span> → <span class="to">${esc(m.to)}</span>: ${esc(m.text)}`;
  const f=$('#feed');const stick=f.scrollHeight-f.scrollTop-f.clientHeight<50;f.appendChild(d);if(stick)f.scrollTop=f.scrollHeight;
}
let _ev=null;
function stream(){
  try{_ev&&_ev.close();}catch(_){}                       // drop any prior connection before reopening (no duplicate streams)
  const ev=new EventSource('/stream?session=all');_ev=ev;
  ev.onmessage=e=>{try{addMsg(JSON.parse(e.data));render();}catch(_){}};
  ev.onerror=()=>{$('#livedot').classList.add('off');setTimeout(()=>{ev.close();if(_ev===ev)stream();$('#livedot').classList.remove('off');},2000);};}
$('#send').onclick=async()=>{const t=$('#text').value.trim();if(!t)return;
  await fetch('/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:'dashboard',to:$('#to').value,text:t})});$('#text').value='';};
$('#text').addEventListener('keydown',e=>{if(e.key==='Enter')$('#send').click();});
fetch('/recent?limit=40').then(r=>r.json()).then(d=>(d.messages||[]).forEach(m=>addMsg(m,false))).catch(()=>{});
$('#hub').textContent=location.host;
/* ---- Learning sidebar: the self-learning loop, surfaced ---- */
const LGRN='#2dd4bf',LRED='#ef6a6a';
// tiny inline-SVG charts (no library) — match the flow view's hand-rolled SVG approach
function lcLine(pts,key,opt){opt=opt||{};const w=300,h=42,pad=4,color=opt.color||LGRN;if(!pts||!pts.length)return '';
  const ys=pts.map(p=>+p[key]||0),max=Math.max(1e-6,...ys),n=pts.length;
  const X=i=>pad+(n<=1?(w-2*pad)/2:i*(w-2*pad)/(n-1)),Y=v=>h-pad-(v/max)*(h-2*pad);
  const pl=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(+p[key]||0).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`+
    (opt.fill?`<polygon points="${pad},${h-pad} ${pl} ${X(n-1).toFixed(1)},${h-pad}" fill="${color}" opacity=".13"/>`:'')+
    `<polyline points="${pl}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`+
    (n===1?`<circle cx="${X(0).toFixed(1)}" cy="${Y(ys[0]).toFixed(1)}" r="2.2" fill="${color}"/>`:'')+`</svg>`;}
function lcBars(pts,key,opt){opt=opt||{};const w=300,h=42,pad=4,color=opt.color||LGRN;if(!pts||!pts.length)return '';
  const ys=pts.map(p=>+p[key]||0),max=Math.max(1e-6,...ys),n=pts.length,gap=(w-2*pad)/n,bw=gap*0.68;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`+pts.map((p,i)=>{const v=+p[key]||0,bh=(v/max)*(h-2*pad),x=pad+i*gap+(gap-bw)/2;
    return `<rect x="${x.toFixed(1)}" y="${(h-pad-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5,bh).toFixed(1)}" rx="1" fill="${color}" opacity=".75"/>`;}).join('')+`</svg>`;}
let LEARN=null,learnProj=localStorage.getItem('abLearnProj')||'';
let learnOpen=localStorage.getItem('abLearnOpen')==='1';
function applyLearnState(){document.querySelector('main').classList.toggle('learn-open',learnOpen);$('#learnChev').textContent=learnOpen?'‹':'›';}
function renderLearnBody(){const el=$('#learnBody');if(!el)return;if(!LEARN){el.innerHTML='<div class="lempty">loading…</div>';return;}
  const L=LEARN,t=L.totals||{};
  let h=`<div class="lsum">Trantor has recorded <b>${t.lessons||0}</b> lessons and baked <b>${t.guardrails||0}</b> guardrails into model prompts. Across <b>${t.turns||0}</b> crew turns the failure rate is <b>${((t.failRate||0)*100).toFixed(1)}%</b> — self-healing as fixes compound.</div>`;
  // Lessons (project filter; lifetime also shows per-agent lessons)
  const projOpts=['<option value="">All projects (lifetime)</option>'].concat((L.lessons.projects||[]).map(p=>`<option value="${esc(p)}"${p===learnProj?' selected':''}>${esc(p)}</option>`)).join('');
  h+=`<div class="lsec"><h3>Lessons <select class="lsel" id="lprojSel">${projOpts}</select></h3>`;
  const lessons=learnProj?(L.lessons.byProject[learnProj]||[]):(L.lessons.global||[]);
  if(!lessons.length)h+=`<div class="lempty">no lessons recorded for this scope yet</div>`;
  else h+=lessons.slice(0,40).map(l=>`<div class="lles"><span class="sc">${esc(l.scope)}</span>${esc(l.text)}</div>`).join('');
  if(!learnProj)for(const[ag,arr]of Object.entries(L.lessons.byAgent||{}))h+=`<div class="lles"><span class="sc">${esc(ag)}</span>${esc(arr[0].text)}${arr.length>1?` <span class="dim">+${arr.length-1} more</span>`:''}</div>`;
  h+=`</div>`;
  // Per-LLM reliability + progression charts — scoped to the selected project (or all)
  const scopeLbl=learnProj?` <span class="dim" style="text-transform:none;letter-spacing:0">· ${esc(learnProj)}</span>`:'';
  const ags=learnProj?(L.agentsByProject[learnProj]||[]):(L.agents||[]);
  h+=`<div class="lsec"><h3>Per-LLM reliability${scopeLbl}</h3>`;
  if(!ags.length)h+=`<div class="lempty">no turn telemetry${learnProj?' for this project':''} yet</div>`;
  for(const a of ags){const fr=(a.failRate*100).toFixed(1);
    h+=`<div class="lcard"><div class="lc-h">${iconFor(a.agent,14)}<span class="nm">${esc(a.agent)}</span><span class="mut">${a.models.filter(m=>m!=='default').join(', ')||'default'}</span></div>`;
    h+=`<span class="lstat"><b>${a.turns}</b> turns</span><span class="lstat ${a.failures?'bad':'good'}"><b>${fr}%</b> fail</span>${a.lastFailure?`<span class="lstat">last exit ${a.lastFailure.exit}</span>`:''}`;
    if((a.series.failRate||[]).length>1)h+=`<div class="lchart"><div class="ltask">fail-rate / day</div>${lcLine(a.series.failRate,'rate',{color:LRED,fill:true})}</div>`;
    if((a.series.lessons||[]).length>1)h+=`<div class="lchart"><div class="ltask">lessons learned (cumulative)</div>${lcLine(a.series.lessons,'count',{color:LGRN,fill:true})}</div>`;
    h+=`</div>`;}
  h+=`</div>`;
  // Baked-in guardrails per model + savings chart — guardrails are global; savings scoped to the project
  h+=`<div class="lsec"><h3>Baked-in improvements${scopeLbl} <span class="lbadge">auto-injected into prompts</span></h3>`;
  const gm=(learnProj?(L.modelsByProject[learnProj]||[]):(L.models||[])).filter(m=>m.guardrailCount>0);
  if(!gm.length)h+=`<div class="lempty">no guardrailed models${learnProj?' used in this project':''} yet</div>`;
  for(const m of gm){h+=`<div class="lcard"><div class="lc-h"><span class="nm">${esc(m.model)}</span>${m.saved_usd?`<span class="mut">$${m.saved_usd} saved · ${m.calls} calls</span>`:''}</div>`;
    for(const[task,arr]of Object.entries(m.guardrails||{})){h+=`<div class="ltask">${esc(task)}</div>`;for(const g of arr)h+=`<div class="lguard">${esc(g)}</div>`;}
    if((m.series.saved||[]).length>1)h+=`<div class="lchart"><div class="ltask">savings / day</div>${lcBars(m.series.saved,'saved',{color:LGRN})}</div>`;
    h+=`</div>`;}
  h+=`</div>`;
  el.innerHTML=h;
  const ps=$('#lprojSel');if(ps)ps.onchange=()=>{learnProj=ps.value;localStorage.setItem('abLearnProj',learnProj);renderLearnBody();};}
async function learn(){try{LEARN=await (await fetch('/learning')).json();if(learnOpen)renderLearnBody();}catch(_){}}
$('#learnToggle').onclick=()=>{learnOpen=!learnOpen;localStorage.setItem('abLearnOpen',learnOpen?'1':'0');applyLearnState();if(learnOpen)renderLearnBody();};
applyLearnState();learn();setInterval(learn,20000);

render();setInterval(render,2500);stream();
// Self-heal after the laptop sleeps / the tab is backgrounded: browser timers and the SSE
// stream get suspended and don't reliably resume, so the board freezes on stale data. The
// moment the tab becomes visible / focused / regains network, force an immediate refresh +
// stream reconnect — the equivalent of the heartbeat's "first action after wake" on the UI side.
function wake(){render();stream();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
addEventListener('focus',wake);
addEventListener('online',wake);
</script>
