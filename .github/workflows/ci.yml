# BUILD-DOCTRINE.md rule 2 ("red blocks merge"): the whole suite runs on every push and PR.
# The failure suite sat red on main for three days (#6446) because nothing ran it on push.
name: ci

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Shared suite setup and gate
        uses: ./.github/actions/suite-setup

      # tsc + vite build: typecheck gate AND the dist/ that tauri's generate_context!
      # embeds at compile time — cargo test cannot build without it.
      - name: Desktop typecheck + build
        run: pnpm -C desktop run build

      - name: Cargo test (desktop/src-tauri)
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
