# Publish trantor to npm via TRUSTED PUBLISHING (OIDC) — no npm token anywhere.
#
# Why this exists. The publish path used to be a long-lived token in the operator's ~/.npmrc, which
# is a dead end on two counts. It blocked: an agent session that had gated a build could not ship it,
# because only the human holds the credential — three sessions in a row ended with verified work
# unpublished. And it expires as a strategy: npm is retiring 2FA-bypass granular tokens, which lose
# direct publish around January 2027 and are cut back to staged publishes needing human approval
# (github.blog changelog, 2026-07-08). Trusted publishing replaces the secret with a short-lived
# OIDC token minted per run, which is why `permissions: id-token: write` below is the whole mechanism
# and there is no NODE_AUTH_TOKEN in this file.
#
# It NEVER fires on a push to main. Two triggers only: a v* tag, or a manual dispatch. So merging
# this file publishes nothing, and neither does any ordinary commit.
#
# The trusted publisher is live on npmjs.com — sashabogi/trantor, release.yml. It must grant
# "npm publish", not only "npm stage publish": the whole point is that a session can ship a gated
# build with nobody at the keyboard, so a human approval step would defeat it. With stage-only the
# publish step fails closed, which is the safe direction if the permission is ever narrowed.
# The stale token in ~/.npmrc is now dead weight and can be deleted.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and stop before publishing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # mints the OIDC token npm exchanges for publish rights. Without it, no auth.

jobs:
  release:
    # macos-latest, matching ci.yml, and not for taste. `npm test` is macOS-dependent in two places:
    # it shells out to the desktop vitest suite, and test/hub/test-duty-seat.mjs asserts the launchd
    # keepalive that bin/duty.mjs only installs when process.platform === "darwin". On ubuntu-latest
    # this job went red on 7 duty-seat assertions and 2 vite failures while ci.yml was green on the
    # same commit — a release gate that disagrees with CI is worse than no gate, because it trains
    # you to wave the red one through. The gate must be the suite CI already proves, in CI's
    # environment.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The suite runs desktop's vitest, so its deps have to be here or the run dies with
      # "Cannot find module 'vite'". Same pinned pnpm as ci.yml: the desktop lockfile is written by
      # 11.18.0 and another major can drift it under --frozen-lockfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships older. Pin rather than track latest so
      # a release cannot change its own toolchain underneath us.
      - name: Pin npm with OIDC support
        run: |
          npm install -g npm@11.19.0
          npm --version

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Install desktop deps (pnpm, frozen)
        run: pnpm -C desktop install --frozen-lockfile

      # The version lives in TWO files and 0.18.50 shipped with them disagreeing: the release commit
      # bumped package.json and missed .claude-plugin/plugin.json. That file wins in
      # hooks/lib/update-check.mjs installedVersion(), so every hook stamped the old version onto peer
      # rows — and update-check compares installed against the registry, so the release would have
      # told every user they were already current and no update prompt would ever have fired.
      # A human caught it once by reading a failing assertion. This makes it impossible to ship again.
      - name: Versions agree, and match the tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "package.json=$PKG  plugin.json=$PLUGIN"
          if [ "$PKG" != "$PLUGIN" ]; then
            echo "::error::version skew — package.json $PKG vs .claude-plugin/plugin.json $PLUGIN. Bump both."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match version $PKG"
              exit 1
            fi
          fi
          if npm view "trantor@$PKG" version >/dev/null 2>&1; then
            echo "::error::trantor@$PKG is already published. Bump the version."
            exit 1
          fi

      # Never publish unverified work. Same env scrub as ci.yml: the drills must not see a runner
      # identity, and each step gets a fresh shell, so unset and run in one.
      - name: Whole suite (npm test)
        run: |
          unset HERDR_ENV HERDR_PANE_ID TRANTOR_ORCH TRANTOR_SEAT RELAY_PROJECT TRANTOR_PROJECT RELAY_SESSION RELAY_AGENT
          npm test

      # The gate that stands in for a human looking at the release: every path bin/cli.mjs can spawn
      # must be in the tarball. cli.mjs resolves subcommands at runtime, so a directory missing from
      # the `files` allowlist passes every other check and dies on a user's machine.
      - name: Tarball carries everything the CLI dispatches to
        run: node test/release/test-package-contents.mjs

      - name: Pack and show what would ship
        run: |
          npm pack --dry-run
          echo "--- files ---"
          npm pack --json --dry-run | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const f=JSON.parse(s)[0];
              console.log(f.filename, f.size+'B', f.entryCount+' entries');
            });"

      # PUBLISH DIRECTLY. This was briefly `npm stage publish`, which put a human 2FA approval
      # between a green build and the registry. The operator's objection is correct and decides it:
      # an approval you cannot reach is not a control, it is latency — and a button pressed
      # reflexively from a phone is not review either. The point of this workflow is that a session
      # can commit, push and ship without anyone at the keyboard.
      #
      # What replaces the human glance is not nothing. It is the gate list above, which runs on
      # every release and does not get tired: version agreement across both files, tag match,
      # not-already-published, the whole suite in CI's own environment, and
      # test/release/test-package-contents.mjs, which asserts every path bin/cli.mjs can spawn is
      # actually in the tarball. That last one catches the class a human reviewer would also have
      # missed — cli.mjs resolves subcommands by path at RUNTIME, so a directory dropped from the
      # `files` allowlist ships green and throws ENOENT on a user's machine.
      #
      # REQUIRES the trusted publisher to grant "npm publish", not just "npm stage publish":
      # npmjs.com → trantor → Settings → Trusted Publisher → Edit. With stage-only it fails closed.
      - name: Publish (trusted, OIDC — no token)
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public

      - name: Published
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          V=$(node -p "require('./package.json').version")
          echo "trantor@$V is live on the registry, with provenance."
          echo "  npm view trantor version"

      - name: Dry run stopped before publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "All gates green. Re-run with dry_run=false, or push a v tag, to publish."
