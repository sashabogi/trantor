name: TrantorCompanion
options:
  bundleIdPrefix: ai.trantor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 68KA9HJDSF
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TrantorCore:
    path: Packages/TrantorCore
  HubClient:
    path: Packages/HubClient
  TrantorStore:
    path: Packages/TrantorStore
  Features:
    path: Packages/Features
  TrantorDesign:
    path: Packages/TrantorDesign
targets:
  TrantorCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - TrantorCompanion.entitlements
    dependencies:
      - package: TrantorCore
      - package: HubClient
      - package: TrantorStore
      - package: Features
      - package: TrantorDesign
      - target: TrantorWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trantor.companion
        PRODUCT_NAME: Trantor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/TrantorCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  TrantorWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrantorWidget
        excludes:
          - Info.plist
          - TrantorWidget.entitlements
    dependencies:
      - package: TrantorStore
      - package: TrantorDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trantor.companion.widget
        PRODUCT_NAME: TrantorWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: TrantorWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TrantorWidget/TrantorWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: NO
  TrantorCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
    dependencies:
      - target: TrantorCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trantor.companion.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Trantor.app/Trantor"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DuoNavigationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/Features/Tests/FeaturesTests/DuoNavigationTests.swift
    dependencies:
      - target: TrantorCompanion
      - package: Features
      - package: TrantorStore
      - package: TrantorDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trantor.duo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Trantor.app/Trantor"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TrantorDesignTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/TrantorDesign/Tests/TrantorDesignTests
    dependencies:
      - package: TrantorDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trantor.design.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DuoNavigation:
    build:
      targets:
        TrantorCompanion: all
        DuoNavigationTests: [test]
    test:
      config: Debug
      targets:
        - DuoNavigationTests
  TrantorDesign:
    build:
      targets:
        TrantorDesignTests: [test]
    test:
      config: Debug
      targets:
        - TrantorDesignTests
  TrantorCompanion:
    build:
      targets:
        TrantorCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrantorCompanionTests
    archive:
      config: Release
